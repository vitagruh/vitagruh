  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f0d"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a09"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0d1117" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85"/>
